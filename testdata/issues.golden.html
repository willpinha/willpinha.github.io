			.container {

			.profile {

			.profile-photo {
				width: 150px;

				object-fit: cover;
				border-radius: 50%;

				margin-bottom: 0.25rem;
			}
			.item-avatar {
				width: 20px;
				height: 20px;
				object-fit: cover;
				border-radius: 50%;
				vertical-align: middle;
				margin-right: 0.25rem;
			}
			.profile-links {
				margin-top: -1rem;
			}
			.updated-at {
				text-align: center;
			}
			.contributions {
				overflow-x: auto;
			}
			.contributions svg {
				display: block;
				margin: 0 auto;
			}
			.contrib-label {
				font-size: 9px;
				fill: var(--pico-muted-color);
			}
			.contrib-level-0 {
				fill: #161b22;
			}
			.contrib-level-1 {
				fill: #0e4429;
			}
			.contrib-level-2 {
				fill: #006d32;
			}
			.contrib-level-3 {
				fill: #26a641;
			}
			.contrib-level-4 {
				fill: #39d353;
			}
		</style>
