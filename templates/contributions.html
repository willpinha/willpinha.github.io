{{define "contributions"}}
<section class="contributions">
	<h3>🗁 Contributions</h3>
	<p>
		<b>{{.Total}}</b> contributions in the last year. They include commits,
		pull requests, issues, and discussions
	</p>
	<div class="contributions-graph">
		<svg
			viewBox="0 0 {{.Width}} {{.Height}}"
			width="{{.Width}}"
			height="{{.Height}}"
		>
			{{range .MonthLabels}}
			<text x="{{.X}}" y="12" class="contrib-label">{{.Label}}</text>
			{{end}} {{range .WeekdayLabels}}
			<text x="0" y="{{.Y}}" class="contrib-label">{{.Label}}</text>
			{{end}} {{range .Cells}}
			<rect
				x="{{.X}}"
				y="{{.Y}}"
				width="9"
				height="9"
				rx="2"
				class="contrib-level-{{.Level}}"
			>
				<title>{{.Tooltip}}</title>
			</rect>
			{{end}}
		</svg>
	</div>
	<div class="contributors">
		{{range .Contributors}}
		<a href="https://github.com/{{.Login}}" target="_blank" rel="noopener noreferrer"
			><img
				class="contributor-avatar"
				src="{{.AvatarURL}}"
				alt="{{.Login}}"
				title="{{.Tooltip}}"
				loading="lazy"
		/></a>
		{{end}}
	</div>
</section>
{{end}}
