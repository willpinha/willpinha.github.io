{{define "layout"}}<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{.Title}}</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
		/>
		<style>
			:root {
				--pico-spacing: 0.75rem;
			}
			.container {
				max-width: 700px;
			}
			.profile {
				text-align: center;
			}
			.profile-photo {
				width: 150px;
				height: 150px;
				object-fit: cover;
				border-radius: 50%;
				border: 2px solid var(--pico-muted-border-color);
				margin-bottom: 0.75rem;
			}
			.profile h1 {
				margin-bottom: 0.25rem;
			}
			.item-avatar {
				width: 20px;
				height: 20px;
				object-fit: cover;
				border-radius: 50%;
				vertical-align: middle;
				margin-right: 0.25rem;
			}
			.profile-links {
				margin-top: -1rem;
			}
			.updated-at {
				text-align: center;
			}
			.contributions {
				overflow-x: auto;
			}
			.contributions svg {
				display: block;
				margin: 0 auto;
			}
			.contrib-label {
				font-size: 9px;
				fill: var(--pico-muted-color);
			}
			.contrib-level-0 {
				fill: #161b22;
			}
			.contrib-level-1 {
				fill: #0e4429;
			}
			.contrib-level-2 {
				fill: #006d32;
			}
			.contrib-level-3 {
				fill: #26a641;
			}
			.contrib-level-4 {
				fill: #39d353;
			}
		</style>
	</head>
	<body>
		<p class="container updated-at">
			<small
				>⟳ The information below is updated daily. Last updated at
				<b>{{.UpdatedAt}} UTC</b></small
			>
		</p>
		<main class="container">{{template "content" .}}</main>
	</body>
</html>
{{end}}
