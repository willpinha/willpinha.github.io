# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
cv:
    name: Willian Pinheiro
    headline: Engenheiro de Software Pleno
    location: São Paulo, Brasil
    email: willpinhaaa@gmail.com
    website: https://willpinha.github.io
    social_networks:
        - network: LinkedIn
          username: willpinha
        - network: GitHub
          username: willpinha
    sections:
        Sobre:
            - >
                Desenvolvedor de software backend com 3 anos de experiência, atualmente focado em sistemas de alta escalabilidade. Gosta de entender os processos de negócio por trás dos sistemas que desenvolve, não apenas a tecnologia, buscando propor, junto com as equipes, soluções que melhorem a operação da empresa como um todo.
        Formação:
            - institution: Universidade de São Paulo (USP)
              area: Sistemas de Informação
              degree: Bacharelado
              start_date: 2020-03
              end_date: 2025-05
        Experiência:
            - company: Mercado Livre
              position: Desenvolvedor de Software
              start_date: 2025-02
              end_date: present
              highlights:
                  - Manutenção e evolução do Warehouse Management System, atuando na otimização de rotas de picking em mais de 100 centros de distribuição
                  - Sistemas que suportam milhões de requisições diárias, mantendo alta disponibilidade em um ambiente de operação crítica
                  - Propôs e implementou ferramentas de observabilidade para identificar inconsistências de dados entre bancos sincronizados e monitorar atrasos em fluxos de processamento críticos
            - company: Círculo Militar de São Paulo
              position: Analista de Sistemas
              start_date: 2024-02
              end_date: 2025-02
              highlights:
                  - Colaborou no desenvolvimento do sistema de reservas de espaços do clube (quadras, salão de beleza, academias) em C# e SQL Server, para uso interno e externo
                  - Integração com sistema terceirizado de controle de acesso por catracas para monitorar a entrada de sócios e funcionários
                  - Desenvolveu de forma independente o sistema de gestão de encomendas, permitindo o registro na recepção e a posterior retirada por sócios e funcionários
        Projetos:
            - name: "[Daisy Components](https://willpinha.github.io/daisy-components)"
              summary: >

              highlights:
                  -
            - name: "[Mantine Themes](https://github.com/willpinha/mantine-themes)"
              summary: >

              highlights:
                  -
        Habilidades:
            - label: Linguagens
              details: TypeScript, JavaScript, Python, Java, Go, SQL
            - label: Bancos de Dados
              details: MySQL, SQL Server, PostgreSQL
            - label: Infraestrutura
              details: Docker, Kubernetes, Fury (IDP do Mercado Livre), mensageria (filas/pub-sub), object storage
            - label: Observabilidade
              details: Grafana, Datadog, ClickHouse
            - label: Idiomas
              details: Português (nativo), Espanhol (intermediário), Inglês (intermediário)
design:
    theme: moderncv
    templates:
        footer: ""
        top_note: ""
locale:
    language: portuguese
settings:
    current_date: today
    pdf_title: Willian Pinheiro
    render_command:
        output_folder: output
        typst_path: OUTPUT_FOLDER/willian-pinheiro-resume.typ
        pdf_path: OUTPUT_FOLDER/willian-pinheiro-resume.pdf
        dont_generate_markdown: true
        dont_generate_html: true
        dont_generate_png: true
