# https://taskfile.dev

version: "3"

tasks:
  clean:
    desc: Remove the build output directory
    cmds:
      - rm -rf dist

  build:
    desc: Clean and build the site into dist
    deps: [clean]
    cmds:
      - GITHUB_TOKEN="${GITHUB_TOKEN:-$(gh auth token)}" go run . -out dist

  dev:
    desc: Rebuild with mock data and serve on change using air
    cmds:
      - go tool air
